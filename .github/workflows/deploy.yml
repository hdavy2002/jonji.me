name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy-api:
    name: Deploy API (Workers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/api
          command: deploy

      - name: Upload Worker secrets
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "${{ secrets.TURSO_PLATFORM_API_TOKEN }}" | ../../node_modules/.bin/wrangler secret put TURSO_PLATFORM_API_TOKEN
          echo "${{ secrets.TINYBIRD_API_KEY }}" | ../../node_modules/.bin/wrangler secret put TINYBIRD_API_KEY
          echo "${{ secrets.RESEND_API_KEY }}" | ../../node_modules/.bin/wrangler secret put RESEND_API_KEY
          echo "${{ secrets.ANTHROPIC_API_KEY }}" | ../../node_modules/.bin/wrangler secret put ANTHROPIC_API_KEY
          echo "${{ secrets.LUCIA_SECRET }}" | ../../node_modules/.bin/wrangler secret put LUCIA_SECRET

  deploy-web:
    name: Deploy Web (Pages)
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @jonji/web build

      - name: Deploy to Cloudflare Pages
        run: cd apps/web && ../../node_modules/.bin/wrangler pages deploy .next --project-name=jonji-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
